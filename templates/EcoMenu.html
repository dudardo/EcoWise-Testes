<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoWise - Plataforma</title>
  
  <link rel="stylesheet" href="{{ url_for('static', filename='EcoC.css') }}">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body> <header class="header-fixo">
    <div class="interface">
      <div class="logo">
        <a href="{{ url_for('EcoH') }}" style="text-decoration: none; color: inherit;">
          <h2>EcoWise 🌱</h2>
        </a>
      </div>
      <nav class="menu-desktop">
        <ul>
          <li><a href="{{ url_for('Perfil') }}">Perfil</a></li>
          <li><a href="{{ url_for('EcoH') }}">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="titulo-menu">Você está no Menu </h1>

    <section class="eco-menu active" id="ecoMenu">
      <div class="menu-conteudo">
        <div class="grupo-menu">
          <div class="caixa-ecoartigos botao-caixa" data-menu="artigos">
            <h3 class="titulo-caixa">EcoArtigos</h3>
            <p>Explore conteúdos ricos e atualizados sobre sustentabilidade...</p>
          </div>
        </div>

        <div class="grupo-menu">
          <div class="caixa-guia-ecofriendly botao-caixa" data-menu="guia">
            <h3 class="titulo-caixa">Guia EcoFriendly</h3>
            <p>Dicas práticas para tornar sua rotina mais verde...</p>
          </div>
        </div>

        <div class="grupo-menu">
          <div class="caixa-ecocalculadora botao-caixa" data-menu="calculadora">
            <h3 class="titulo-caixa">EcoCalculadora</h3>
            <p>Descubra sua pegada ecológica...</p>
          </div>
        </div>

        <div class="grupo-menu">
          <div class="caixa-ecodesafios botao-caixa" data-menu="desafios">
            <h3 class="titulo-caixa">EcoDesafios</h3>
            <p>Participe de desafios criativos...</p>
          </div>
        </div>
      </div>
    </section>

    <section id="content"></section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll('.botao-caixa').forEach(caixa => {
        caixa.addEventListener('click', () => {
          const destino = caixa.getAttribute('data-menu');
          if (destino === "artigos") window.location.href = "{{ url_for('ecoartigos') }}";
          if (destino === "guia") window.location.href = "{{ url_for('Guia') }}";
          if (destino === "calculadora") window.location.href = "{{ url_for('Calculadora') }}";
          if (destino === "desafios") window.location.href = "{{ url_for('Desafios') }}";
        });
      });
    });
  </script>
</body>
</html>
